<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:#fdf9f1;
  color:#2b2b2b;
  line-height:1.6;
  display:flex;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.card{
  background:#fff;
  max-width:420px;
  width:100%;
  border-radius:28px;
  padding:36px 32px 28px;
  box-shadow:0 12px 40px rgba(0,0,0,0.06);
  border:1px solid #f2e9d9;
  text-align:center;
}
.logo{
  font-weight:800;
  letter-spacing:0.18em;
  font-size:22px;
  margin-bottom:6px;
}
.sub{
  font-size:13px;
  color:#8a7e6d;
  letter-spacing:0.04em;
  margin-bottom:28px;
}
.desc{
  font-size:14.5px;
  color:#4a4a4a;
  margin-bottom:28px;
  word-break:keep-all;
}
.btns{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:13px 16px;
  border-radius:14px;
  text-decoration:none;
  font-size:14.5px;
  font-weight:600;
  transition:all .15s;
}
.btn-primary{background:#2b2b2b;color:#fff}
.btn-primary:hover{background:#000}
.btn-outline{background:#fdf9f1;color:#2b2b2b;border:1px solid #e9ddd0}
.btn-outline:hover{background:#f7efe0}
.btn-light{background:#fff;color:#6b5e4d;border:1px solid #eee1d0}
.btn-light:hover{background:#fdf6e9}
.divider{height:1px;background:#f2e9d9;margin:22px 0}
.footer{font-size:11.5px;color:#b0a596;line-height:1.5}
.footer a{color:#8a7e6d;text-decoration:none}
.footer a:hover{text-decoration:underline}
.dot{width:4px;height:4px;background:#e8d9c0;border-radius:50%;display:inline-block;margin:0 6px;vertical-align:middle}
</style>
</head>
