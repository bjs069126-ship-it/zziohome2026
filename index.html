<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zziohome - 비즈니스 프로필</title>
<meta name="description" content="zziohome 비즈니스 프로필 및 링크 모음입니다.">
<style>
/* 폰트 및 기본 여백 초기화 */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:#fdf9f1; /* 따뜻한 배경색 */
  color:#2b2b2b;
  line-height:1.6;
  display:flex;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  padding:24px;
}
/* 메인 카드 스타일 */
.card{
  background:#fff;
  max-width:420px;
  width:100%;
  border-radius:28px;
  padding:36px 32px 28px;
  box-shadow:0 12px 40px rgba(0,0,0,0.06);
  border:1px solid #f2e9d9;
  text-align:center;
}
.logo{
  font-weight:800;
  letter-spacing:0.18em;
  font-size:22px;
  margin-bottom:6px;
}
.sub{
  font-size:13px;
  color:#8a7e6d;
  letter-spacing:0.04em;
  margin-bottom:28px;
}
.desc{
  font-size:14.5px;
  color:#4a4a4a;
  margin-bottom:28px;
  word-break:keep-all;
}
/* 버튼 그룹 */
.btns{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:14px 16px;
  border-radius:14px;
  text-decoration:none;
  font-size:15px;
  font-weight:600;
  transition:all .15s ease-in-out;
}
/* 버튼 색상 디자인 */
.btn-primary{background:#2b2b2b;color:#fff}
.btn-primary:hover{background:#000; transform: translateY(-2px);}
.btn-outline{background:#fdf9f1;color:#2b2b2b;border:1px solid #e9ddd0}
.btn-outline:hover{background:#f7efe0; transform: translateY(-2px);}
.btn-light{background:#fff;color:#6b5e4d;border:1px solid #eee1d0}
.btn-light:hover{background:#fdf6e9; transform: translateY(-2px);}

.divider{height:1px;background:#f2e9d9;margin:22px 0}
.footer{font-size:12px;color:#b0a596;line-height:1.6}
.footer a{color:#8a7e6d;text-decoration:none}
.footer a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">ZZIOHOME</div>
    <div class="sub">Business & Creator</div>
    <div class="desc">
      안녕하세요, zziohome입니다.<br>협업 문의나 다양한 기록들은 아래 링크를 확인해 주세요.
    </div>
    
    <div class="btns">
      <!-- 인스타그램 연결 -->
      <a class="btn btn-primary" href="https://www.instagram.com/zziohome" target="_blank" rel="noopener">인스타그램 @zziohome</a>
      
      <!-- 블로그 연결 (네이버 블로그를 기준으로 작성했습니다. 티스토리라면 주소를 수정하세요) -->
      <a class="btn btn-outline" href="https://blog.naver.com/zziohome" target="_blank" rel="noopener">블로그 zziohome</a>
      
      <!-- 리틀리 연결 -->
      <a class="btn btn-outline" href="https://litt.ly/zio.mom_" target="_blank" rel="noopener">링크 모음 litt.ly/zio.mom_</a>
      
      <!-- 이메일 연결 (클릭 시 메일 앱 자동 실행) -->
      <a class="btn btn-light" href="mailto:bjs069126@gmail.com">메일 보내기 (bjs069126@gmail.com)</a>
    </div>
    
    <div class="divider"></div>
    <div class="footer">
      <a href="mailto:bjs069126@gmail.com">bjs069126@gmail.com</a><br>
      © 2026 zziohome. All rights reserved.
    </div>
  </div>
</body>
</html>
